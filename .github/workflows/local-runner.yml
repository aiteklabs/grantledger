name: local-runner
# Sources that refuse Cloudflare egress are crawled from GitHub's runners and pushed to the Worker's /ingest endpoint.
# Runs after the Worker's 03:00 crawl and its 04:00 retry, so the list of failed feeds is final.
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: Space-separated source ids
        default: se_vinnova be_vlaio it_incentivi
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - name: Crawl and push
        working-directory: packages/ingest
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          INGEST_URL: ${{ secrets.INGEST_URL }}
          SOURCES: ${{ github.event.inputs.sources || 'se_vinnova be_vlaio it_incentivi' }}
        # Every source runs even when one fails; the job still fails at the end so a broken crawl is visible.
        run: |
          # On the nightly schedule, also crawl every feed whose last Worker crawl failed: a publisher that starts
          # refusing Cloudflare is refreshed from here without a code change. A failed lookup only skips this.
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            failing=$(curl -fsS -m 30 "$INGEST_URL/failing" | jq -r '.[]' | tr '\n' ' ') || failing=""
            echo "failed on the Worker: ${failing:-none}"
            SOURCES="$SOURCES $failing"
          fi
          status=0
          for s in $(printf '%s\n' $SOURCES | awk '!seen[$0]++'); do
            case "$s" in
              *[!a-z_]*) echo "invalid source id: $s"; status=1; continue ;;
            esac
            echo "== $s"
            # A publisher that hangs must not use up the job: ten minutes per source.
            timeout 10m bun scripts/push-local.ts "$s" || { echo "$s failed"; status=1; }
          done
          exit $status
